name: CI/CD - product_agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- CI: 빌드/기본 검증 (GitHub 클라우드 러너, 서버 접근 불필요) ----------
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 모듈 임포트 스모크 테스트
        run: |
          python -c "import rag_pipeline; import agent_workflow; import llm_client; import main; print('OK: 모든 모듈 임포트 성공')"

      - name: RAG 파이프라인 동작 테스트
        run: |
          cd .
          python -c "
          from rag_pipeline import load_documents, chunk_documents, AdvancedRAGIndex
          from agent_workflow import build_workflow, run_agent
          raw = load_documents('product_data/rag_product_data.txt')
          chunks = chunk_documents(raw)
          index = AdvancedRAGIndex(chunks)
          wf = build_workflow(index)
          r = run_agent(wf, '패딩 재고 있나요?')
          assert r['answer'], '답변이 비어있음'
          print('OK:', r['answer'][:40])
          "

  # ---------- CD: 실제 서버 배포 ----------
  # 러너는 Windows(로컬 PC, VPN 연결됨) — 직접 배포하지 않고
  # SSH로 H200 서버에 접속해서 그 안에서 git pull + docker compose를 실행시킨다.
  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: SSH로 H200 서버에 배포
        shell: pwsh
        run: |
          ssh Vpn_H200_Server "cd ~/llm/product_agent && git pull origin main && export ANTHROPIC_API_KEY='${{ secrets.ANTHROPIC_API_KEY }}' && docker compose down && docker compose up -d --build"

      - name: 배포 후 헬스체크 (H200 안에서 curl)
        shell: pwsh
        run: |
          ssh Vpn_H200_Server "sleep 5 && curl -f http://localhost:8022/"
